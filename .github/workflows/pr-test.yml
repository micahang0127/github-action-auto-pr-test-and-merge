name: PR Test & Coverage

on:
  push:
    branches:
      - feature/**

permissions:
  contents: write
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run linter
        id: lint
        run: pnpm lint
        continue-on-error: true

      - name: Build project
        id: build
        run: pnpm build
        continue-on-error: true

      - name: Create or get PR
        id: pr
        run: |
          BRANCH_NAME="${GITHUB_REF_NAME}"
          echo "BRANCH_NAME=$BRANCH_NAME" >> $GITHUB_ENV

          EXISTING_PR=$(gh pr list --head "$BRANCH_NAME" --base dev --json number --jq length)
          if [ "$EXISTING_PR" -eq 0 ]; then
            gh pr create \
              --title "PR: $BRANCH_NAME" \
              --body-file .github/pull_request_template.md \
              --base dev \
              --head "$BRANCH_NAME"
          fi

          PR_NUMBER=$(gh pr list --head "$BRANCH_NAME" --base dev --json number --jq '.[0].number')
          PR_URL=$(gh pr view "$PR_NUMBER" --json url --jq '.url')
          echo "PR_NUMBER=$PR_NUMBER" >> $GITHUB_ENV
          echo "PR_URL=$PR_URL" >> $GITHUB_ENV
        env:
          GITHUB_TOKEN: ${{ secrets.PR_CREATE }}

      - name: Comment on PR (Failure)
        if: |
          steps.lint.outcome == 'failure' ||
          steps.build.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const results = {
              'Linting': '${{ steps.lint.outcome }}',
              'Build': '${{ steps.build.outcome }}'
            };

            let failedChecks = [];
            Object.entries(results).forEach(([check, outcome]) => {
              if (outcome === 'failure') {
                failedChecks.push(`| ${check} | ❌ Failed |`);
              }
            });

            const comment = `## ❌ 검사 실패

            다음 항목에서 실패했습니다. 코드를 수정한 후 다시 커밋해주세요.

            | 항목 | 상태 |
            |------|------|
            ${failedChecks.join('\n')}

            [전체 결과 보기](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
            `;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ${{ env.PR_NUMBER }},
              body: comment
            });

      - name: Close PR (Failure)
        if: |
          steps.lint.outcome == 'failure' ||
          steps.build.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: ${{ env.PR_NUMBER }},
              state: 'closed'
            });

      - name: Discord 알림 (실패)
        if: |
          steps.lint.outcome == 'failure' ||
          steps.build.outcome == 'failure'
        run: |
          LINT_STATUS="${{ steps.lint.outcome == 'failure' && '❌ 실패' || '✅ 성공' }}"
          BUILD_STATUS="${{ steps.build.outcome == 'failure' && '❌ 실패' || '✅ 성공' }}"
          curl -H "Content-Type: application/json" \
            -d "{
              \"embeds\": [{
                \"title\": \"❌ PR 테스트 실패\",
                \"color\": 15158332,
                \"fields\": [
                  {\"name\": \"브랜치\", \"value\": \"$BRANCH_NAME\", \"inline\": true},
                  {\"name\": \"PR\", \"value\": \"[#$PR_NUMBER]($PR_URL)\", \"inline\": true},
                  {\"name\": \"Lint\", \"value\": \"$LINT_STATUS\", \"inline\": true},
                  {\"name\": \"Build\", \"value\": \"$BUILD_STATUS\", \"inline\": true}
                ],
                \"url\": \"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"
              }]
            }" \
            ${{ secrets.DISCORD_WEBHOOK }}

      - name: Comment on PR (Success)
        if: |
          steps.lint.outcome == 'success' &&
          steps.build.outcome == 'success'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const comment = `## ✅ 모든 검사 통과

            | 항목 | 상태 |
            |------|------|
            | Linting | ✅ Success |
            | Build | ✅ Success |

            모든 검사가 통과했습니다! 🎉

            자동으로 dev 브랜치로 merge됩니다.

            [전체 결과 보기](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
            `;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ${{ env.PR_NUMBER }},
              body: comment
            });

      - name: Verify PR base is dev
        if: |
          steps.lint.outcome == 'success' &&
          steps.build.outcome == 'success'
        run: |
          PR_BASE=$(gh pr view "$PR_NUMBER" --json baseRefName --jq '.baseRefName')
          if [ "$PR_BASE" != "dev" ]; then
            echo "❌ Error: PR base is $PR_BASE, not dev"
            exit 1
          fi
          echo "✅ PR base is dev"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Auto merge PR to dev (Success)
        if: |
          steps.lint.outcome == 'success' &&
          steps.build.outcome == 'success'
        run: gh pr merge "$PR_NUMBER" --squash --delete-branch
        env:
          GITHUB_TOKEN: ${{ secrets.PR_CREATE }}

      - name: Discord 알림 (성공)
        if: |
          steps.lint.outcome == 'success' &&
          steps.build.outcome == 'success'
        run: |
          curl -H "Content-Type: application/json" \
            -d "{
              \"embeds\": [{
                \"title\": \"✅ PR 테스트 성공 & dev 머지 완료\",
                \"color\": 3066993,
                \"fields\": [
                  {\"name\": \"브랜치\", \"value\": \"$BRANCH_NAME\", \"inline\": true},
                  {\"name\": \"PR\", \"value\": \"[#$PR_NUMBER]($PR_URL)\", \"inline\": true},
                  {\"name\": \"Lint\", \"value\": \"✅ 성공\", \"inline\": true},
                  {\"name\": \"Build\", \"value\": \"✅ 성공\", \"inline\": true}
                ],
                \"url\": \"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"
              }]
            }" \
            ${{ secrets.DISCORD_WEBHOOK }}

      - name: Fail workflow if checks failed
        if: |
          steps.lint.outcome == 'failure' ||
          steps.build.outcome == 'failure'
        run: exit 1
