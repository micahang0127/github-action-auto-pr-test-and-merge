name: PR Test & Coverage

on:
  pull_request:
    branches:
      - dev

permissions:
  contents: write
  pull-requests: write

jobs:
  test:
    if: |
      startsWith(github.head_ref, 'feature/')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check Formatting
        id: format
        run: |
          set -o pipefail
          pnpm format:check 2>&1 | tee /tmp/format_output.txt
          echo "exit_code=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Run linter
        id: lint
        run: |
          set -o pipefail
          pnpm lint 2>&1 | tee /tmp/lint_output.txt
          echo "exit_code=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Run Unit Tests
        id: unit_test
        run: |
          set -o pipefail
          pnpm test --run 2>&1 | tee /tmp/test_output.txt
          echo "exit_code=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Build project
        id: build
        run: |
          set -o pipefail
          pnpm build 2>&1 | tee /tmp/build_output.txt
          echo "exit_code=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Set PR variables
        run: |
          echo "PR_NUMBER=${{ github.event.pull_request.number }}" >> $GITHUB_ENV
          echo "PR_URL=${{ github.event.pull_request.html_url }}" >> $GITHUB_ENV
          echo "BRANCH_NAME=${{ github.event.pull_request.head.ref }}" >> $GITHUB_ENV
          echo "PR_TITLE<<EOF" >> $GITHUB_ENV
          echo "${{ github.event.pull_request.title }}" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Comment on PR (Failure)
        if: |
          steps.format.outcome == 'failure' ||
          steps.lint.outcome == 'failure' ||
          steps.unit_test.outcome == 'failure' ||
          steps.build.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const results = {
              'Formatting': '${{ steps.format.outcome }}',
              'Linting': '${{ steps.lint.outcome }}',
              'Unit Test': '${{ steps.unit_test.outcome }}',
              'Build': '${{ steps.build.outcome }}'
            };

            let failedChecks = [];
            Object.entries(results).forEach(([check, outcome]) => {
              if (outcome === 'failure') {
                failedChecks.push(`| ${check} | ❌ Failed |`);
              } else {
                failedChecks.push(`| ${check} | ✅ Success |`);
              }
            });

            const comment = `## ❌ PR 검사 실패

            다음 항목 중 일부가 실패했습니다. 코드를 수정한 후 다시 커밋해주세요.

            | 항목 | 상태 |
            |------|------|
            ${failedChecks.join('\n')}

            [상세 로그 확인](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
            `;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ${{ github.event.pull_request.number }},
              body: comment
            });

      - name: Close PR (Failure)
        if: |
          steps.format.outcome == 'failure' ||
          steps.lint.outcome == 'failure' ||
          steps.unit_test.outcome == 'failure' ||
          steps.build.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: ${{ github.event.pull_request.number }},
              state: 'closed'
            });

      - name: Discord 알림 (실패)
        if: |
          steps.format.outcome == 'failure' ||
          steps.lint.outcome == 'failure' ||
          steps.unit_test.outcome == 'failure' ||
          steps.build.outcome == 'failure'
        run: |
          FORMAT_STATUS="${{ steps.format.outcome == 'failure' && '❌ 실패' || '✅ 성공' }}"
          LINT_STATUS="${{ steps.lint.outcome == 'failure' && '❌ 실패' || '✅ 성공' }}"
          TEST_STATUS="${{ steps.unit_test.outcome == 'failure' && '❌ 실패' || '✅ 성공' }}"
          BUILD_STATUS="${{ steps.build.outcome == 'failure' && '❌ 실패' || '✅ 성공' }}"

          FIELDS=$(jq -n \
            --arg branch "${{ env.BRANCH_NAME }}" \
            --arg pr_title "[#${{ env.PR_NUMBER }}] ${{ env.PR_TITLE }}" \
            --arg pr_url "${{ env.PR_URL }}" \
            --arg actor "${{ github.actor }}" \
            --arg format "$FORMAT_STATUS" \
            --arg lint  "$LINT_STATUS" \
            --arg test  "$TEST_STATUS" \
            --arg build "$BUILD_STATUS" \
            '[
              {"name": "브랜치",  "value": $branch, "inline": true},
              {"name": "PR",      "value": ("[" + $pr_title + "](" + $pr_url + ")"), "inline": true},
              {"name": "작성자",  "value": $actor,  "inline": true},
              {"name": "Format",  "value": $format, "inline": true},
              {"name": "Lint",    "value": $lint,   "inline": true},
              {"name": "Test",    "value": $test,   "inline": true},
              {"name": "Build",   "value": $build,  "inline": true}
            ]')

          # 에러 로그 추가 함수
          add_error_log() {
            local step_name=$1
            local file_path=$2
            local outcome=$3
            if [ "$outcome" = "failure" ] && [ -s "$file_path" ]; then
              local msg=$(tail -c 1000 "$file_path")
              FIELDS=$(echo "$FIELDS" | jq \
                --arg name "$step_name 에러" \
                --arg msg "$msg" \
                '. + [{"name": $name, "value": ("```\n" + $msg + "\n```"), "inline": false}]')
            fi
          }

          add_error_log "Format" "/tmp/format_output.txt" "${{ steps.format.outcome }}"
          add_error_log "Lint" "/tmp/lint_output.txt" "${{ steps.lint.outcome }}"
          add_error_log "Test" "/tmp/test_output.txt" "${{ steps.unit_test.outcome }}"
          add_error_log "Build" "/tmp/build_output.txt" "${{ steps.build.outcome }}"

          PAYLOAD=$(jq -n \
            --argjson fields "$FIELDS" \
            --arg url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            '{
              "embeds": [{
                "title": "❌ [LAB-MANAGER-FRONT] PR 테스트 실패 및 자동 닫힘",
                "description": "테스트가 실패하여 PR이 자동으로 닫혔습니다. 수정한 후 다시 PR을 생성해주세요.",
                "color": 15158332,
                "fields": $fields,
                "url": $url
              }]
            }')

          curl -X POST -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            ${{ secrets.DISCORD_PR_URL }}

      - name: Comment on PR (Success)
        if: |
          steps.format.outcome == 'success' &&
          steps.lint.outcome == 'success' &&
          steps.unit_test.outcome == 'success' &&
          steps.build.outcome == 'success'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const comment = `## ✅ 모든 검사 통과

            | 항목 | 상태 |
            |------|------|
            | Formatting | ✅ Success |
            | Linting | ✅ Success |
            | Unit Test | ✅ Success |
            | Build | ✅ Success |

            모든 검사가 통과했습니다! 🎉
            자동으로 dev 브랜치로 merge됩니다.

            [상세 로그 확인](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
            `;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ${{ github.event.pull_request.number }},
              body: comment
            });

      - name: Verify PR base is dev
        if: |
          steps.format.outcome == 'success' &&
          steps.lint.outcome == 'success' &&
          steps.unit_test.outcome == 'success' &&
          steps.build.outcome == 'success'
        run: |
          PR_BASE=$(gh pr view "${{ github.event.pull_request.number }}" --json baseRefName --jq '.baseRefName')
          if [ "$PR_BASE" != "dev" ]; then
            echo "❌ Error: PR base is $PR_BASE, not dev"
            exit 1
          fi
          echo "✅ PR base is dev"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Auto merge PR to dev (Success)
        if: |
          steps.format.outcome == 'success' &&
          steps.lint.outcome == 'success' &&
          steps.unit_test.outcome == 'success' &&
          steps.build.outcome == 'success'
        run: gh pr merge "${{ github.event.pull_request.number }}" --squash --delete-branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Discord 알림 (성공)
        if: |
          steps.format.outcome == 'success' &&
          steps.lint.outcome == 'success' &&
          steps.unit_test.outcome == 'success' &&
          steps.build.outcome == 'success'
        run: |
          PAYLOAD=$(jq -n \
            --arg branch "${{ env.BRANCH_NAME }}" \
            --arg pr_title "[#${{ env.PR_NUMBER }}] ${{ env.PR_TITLE }}" \
            --arg pr_url "${{ env.PR_URL }}" \
            --arg actor "${{ github.actor }}" \
            --arg url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            '{
              "embeds": [{
                "title": "✅ [LAB-MANAGER-FRONT] PR 테스트 성공 & dev 머지 완료",
                "color": 3066993,
                "fields": [
                  {"name": "브랜치", "value": $branch, "inline": true},
                  {"name": "PR", "value": ("[" + $pr_title + "](" + $pr_url + ")"), "inline": true},
                  {"name": "작성자", "value": $actor, "inline": true},
                  {"name": "Format", "value": "✅ 성공", "inline": true},
                  {"name": "Lint", "value": "✅ 성공", "inline": true},
                  {"name": "Test", "value": "✅ 성공", "inline": true},
                  {"name": "Build", "value": "✅ 성공", "inline": true}
                ],
                "url": $url
              }]
            }')

          curl -X POST -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            ${{ secrets.DISCORD_PR_URL }}

      - name: Fail workflow if checks failed
        if: |
          steps.format.outcome == 'failure' ||
          steps.lint.outcome == 'failure' ||
          steps.unit_test.outcome == 'failure' ||
          steps.build.outcome == 'failure'
        run: exit 1
