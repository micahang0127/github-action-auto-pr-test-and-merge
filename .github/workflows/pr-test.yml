name: PR Test & Coverage

on:
  workflow_run:
    workflows: ["Auto PR Create"]
    types: [completed]

permissions:
  contents: write        
  pull-requests: write   

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get PR number
        id: pr
        run: |
          PR_NUMBER=$(gh pr list --head "${{ github.event.workflow_run.head_branch }}" --json number --jq '.[0].number')
          echo "pr_number=$PR_NUMBER" >> $GITHUB_OUTPUT
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run linter
        id: lint
        run: pnpm lint
        continue-on-error: true

      - name: Build project
        id: build
        run: pnpm build
        continue-on-error: true

      - name: Comment on PR (Failure)
        if: |
          steps.lint.outcome == 'failure' ||
          steps.build.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const results = {
              'Linting': '${{ steps.lint.outcome }}',
              'Build': '${{ steps.build.outcome }}'
            };

            let failedChecks = [];
            Object.entries(results).forEach(([check, outcome]) => {
              if (outcome === 'failure') {
                failedChecks.push(`| ${check} | ❌ Failed |`);
              }
            });

            const comment = `## ❌ 검사 실패

            다음 항목에서 실패했습니다. 코드를 수정한 후 다시 커밋해주세요.

            | 항목 | 상태 |
            |------|------|
            ${failedChecks.join('\n')}

            [전체 결과 보기](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
            `;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ${{ steps.pr.outputs.pr_number }},
              body: comment
            });

      - name: Close PR (Failure)
        if: |
          steps.lint.outcome == 'failure' ||
          steps.build.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: ${{ steps.pr.outputs.pr_number }},
              state: 'closed'
            });

      - name: Comment on PR (Success)
        if: |
          steps.lint.outcome == 'success' &&
          steps.build.outcome == 'success'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const comment = `## ✅ 모든 검사 통과

            | 항목 | 상태 |
            |------|------|
            | Linting | ✅ Success |
            | Build | ✅ Success |

            모든 검사가 통과했습니다! 🎉

            자동으로 dev 브랜치로 merge됩니다.

            [전체 결과 보기](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
            `;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ${{ steps.pr.outputs.pr_number }},
              body: comment
            });

      - name: Verify PR base is dev
        if: |
          steps.lint.outcome == 'success' &&
          steps.build.outcome == 'success'
        run: |
          PR_BASE=$(gh pr view ${{ steps.pr.outputs.pr_number }} --json baseRefName --jq '.baseRefName')
          if [ "$PR_BASE" != "dev" ]; then
            echo "❌ Error: PR base is $PR_BASE, not dev"
            exit 1
          fi
          echo "✅ PR base is dev"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Auto merge PR to dev (Success)
        if: |
          steps.lint.outcome == 'success' &&
          steps.build.outcome == 'success'
        run: gh pr merge ${{ steps.pr.outputs.pr_number }} --squash --delete-branch
        env:
          GITHUB_TOKEN: ${{ secrets.PR_CREATE }}

      - name: Fail workflow if checks failed
        if: |
          steps.lint.outcome == 'failure' ||
          steps.build.outcome == 'failure'
        run: exit 1
