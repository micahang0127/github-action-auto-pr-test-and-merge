name: Auto Create PR

on:
  push:
    branches:
      - feature/#1-test

jobs:
  create-pr:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Create PR to dev
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 이미 열려있는 PR이 있는지 확인
          EXISTING_PR=$(gh pr list \
            --head feature/#1-test \
            --base dev \
            --state open \
            --json number \
            -q '.[0].number')

          if [ -z "$EXISTING_PR" ]; then
            # PR이 없으면 새로 생성
            gh pr create \
              --base dev \
              --head feature/#1-test \
              --title "자동 생성 PR: feature/#1-test" \
              --body "자동으로 생성된 PR입니다. 테스트가 자동으로 실행됩니다."
            echo "✅ PR이 자동으로 생성되었습니다."
          else
            echo "⚠️ 이미 열려있는 PR #$EXISTING_PR이 있습니다."
          fi
