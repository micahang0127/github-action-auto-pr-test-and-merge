name: Auto PR Create

on:
  push:
    branches:
      - feature/**

permissions:
  contents: write        
  pull-requests: write 

jobs:
  create-pr:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract branch name
        id: branch
        run: |
          BRANCH_NAME="${GITHUB_REF#refs/heads/}"
          echo "branch_name=$BRANCH_NAME" >> $GITHUB_OUTPUT
          echo "Branch: $BRANCH_NAME"

      - name: Check for existing PR
        id: check-pr
        run: |
          EXISTING_PR=$(gh pr list --head "${{ steps.branch.outputs.branch_name }}" --json number --jq length)
          echo "existing_pr_count=$EXISTING_PR" >> $GITHUB_OUTPUT
          if [ "$EXISTING_PR" -gt 0 ]; then
            echo "PR already exists for this branch"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create PR
        if: steps.check-pr.outputs.existing_pr_count == '0'
        run: |
          gh pr create \
            --title "$(echo '${{ steps.branch.outputs.branch_name }}' | sed 's/feature\///')" \
            --body "Automated PR creation from ${{ steps.branch.outputs.branch_name }}" \
            --base main \
            --head "${{ steps.branch.outputs.branch_name }}" \
            --draft
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: PR already exists
        if: steps.check-pr.outputs.existing_pr_count != '0'
        run: echo "Skipping PR creation - PR already exists for branch ${{ steps.branch.outputs.branch_name }}"
