name: PR Test & Coverage (main)

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  test:
    if: github.head_ref == 'dev'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run linter
        id: lint
        run: |
          set -o pipefail
          pnpm lint 2>&1 | tee /tmp/lint_output.txt
          echo "exit_code=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Build project
        id: build
        run: |
          set -o pipefail
          pnpm build 2>&1 | tee /tmp/build_output.txt
          echo "exit_code=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Set PR variables
        run: |
          echo "PR_NUMBER=${{ github.event.pull_request.number }}" >> $GITHUB_ENV
          echo "PR_URL=${{ github.event.pull_request.html_url }}" >> $GITHUB_ENV
          echo "BRANCH_NAME=${{ github.event.pull_request.head.ref }}" >> $GITHUB_ENV

      - name: Comment on PR (Failure)
        if: |
          steps.lint.outcome == 'failure' ||
          steps.build.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const results = {
              'Linting': '${{ steps.lint.outcome }}',
              'Build': '${{ steps.build.outcome }}'
            };

            let failedChecks = [];
            Object.entries(results).forEach(([check, outcome]) => {
              if (outcome === 'failure') {
                failedChecks.push(`| ${check} | ❌ Failed |`);
              }
            });

            const comment = `## ❌ 검사 실패

            다음 항목에서 실패했습니다. 코드를 수정한 후 다시 커밋해주세요.

            | 항목 | 상태 |
            |------|------|
            ${failedChecks.join('\n')}

            [전체 결과 보기](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
            `;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ${{ github.event.pull_request.number }},
              body: comment
            });

      - name: Close PR (Failure)
        if: |
          steps.lint.outcome == 'failure' ||
          steps.build.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: ${{ github.event.pull_request.number }},
              state: 'closed'
            });

      - name: Discord 알림 (실패)
        if: |
          steps.lint.outcome == 'failure' ||
          steps.build.outcome == 'failure'
        run: |
          LINT_STATUS="${{ steps.lint.outcome == 'failure' && '❌ 실패' || '✅ 성공' }}"
          BUILD_STATUS="${{ steps.build.outcome == 'failure' && '❌ 실패' || '✅ 성공' }}"

          # 기본 필드 구성
          FIELDS=$(jq -n \
            --arg branch "${{ env.BRANCH_NAME }}" \
            --arg pr    "[#${{ env.PR_NUMBER }}](${{ env.PR_URL }})" \
            --arg actor "${{ github.actor }}" \
            --arg lint  "$LINT_STATUS" \
            --arg build "$BUILD_STATUS" \
            '[
              {"name": "브랜치",  "value": $branch, "inline": true},
              {"name": "PR",      "value": $pr,     "inline": true},
              {"name": "작성자",  "value": $actor,  "inline": true},
              {"name": "Lint",    "value": $lint,   "inline": true},
              {"name": "Build",   "value": $build,  "inline": true}
            ]')

          # Lint 에러 메시지 조건부 추가
          if [ "${{ steps.lint.outcome }}" = "failure" ] && [ -s /tmp/lint_output.txt ]; then
            LINT_MSG=$(head -c 1016 /tmp/lint_output.txt)
            FIELDS=$(echo "$FIELDS" | jq \
              --arg msg "$LINT_MSG" \
              '. + [{"name": "Lint 에러", "value": ("```\n" + $msg + "\n```"), "inline": false}]')
          fi

          # Build 에러 메시지 조건부 추가
          if [ "${{ steps.build.outcome }}" = "failure" ] && [ -s /tmp/build_output.txt ]; then
            BUILD_MSG=$(head -c 1016 /tmp/build_output.txt)
            FIELDS=$(echo "$FIELDS" | jq \
              --arg msg "$BUILD_MSG" \
              '. + [{"name": "Build 에러", "value": ("```\n" + $msg + "\n```"), "inline": false}]')
          fi

          PAYLOAD=$(jq -n \
            --argjson fields "$FIELDS" \
            --arg url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            '{
              "embeds": [{
                "title": "❌ PR 테스트 실패",
                "color": 15158332,
                "fields": $fields,
                "url": $url
              }]
            }')

          curl -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "${{ secrets.DISCORD_WEBHOOK }}"

      - name: Comment on PR (Success)
        if: |
          steps.lint.outcome == 'success' &&
          steps.build.outcome == 'success'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const comment = `## ✅ 모든 검사 통과

            | 항목 | 상태 |
            |------|------|
            | Linting | ✅ Success |
            | Build | ✅ Success |

            모든 검사가 통과했습니다! 🎉

            자동으로 main 브랜치로 merge됩니다.

            [전체 결과 보기](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
            `;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ${{ github.event.pull_request.number }},
              body: comment
            });

      - name: Verify PR is from dev to main
        if: |
          steps.lint.outcome == 'success' &&
          steps.build.outcome == 'success'
        run: |
          PR_HEAD=$(gh pr view ${{ github.event.pull_request.number }} --json headRefName --jq '.headRefName')
          if [ "$PR_HEAD" != "dev" ]; then
            echo "❌ Error: PR must be from dev branch, but got $PR_HEAD"
            exit 1
          fi
          echo "✅ PR is from dev branch"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Auto merge PR to main (Success)
        if: |
          steps.lint.outcome == 'success' &&
          steps.build.outcome == 'success'
        run: gh pr merge ${{ github.event.pull_request.number }} --squash --delete-branch
        env:
          GITHUB_TOKEN: ${{ secrets.PR_CREATE }}

      - name: Discord 알림 (성공)
        if: |
          steps.lint.outcome == 'success' &&
          steps.build.outcome == 'success'
        run: |
          curl -H "Content-Type: application/json" \
            -d "{
              \"embeds\": [{
                \"title\": \"✅ PR 테스트 성공 & main 머지 완료\",
                \"color\": 3066993,
                \"fields\": [
                  {\"name\": \"브랜치\", \"value\": \"${{ env.BRANCH_NAME }}\", \"inline\": true},
                  {\"name\": \"PR\", \"value\": \"[#${{ env.PR_NUMBER }}](${{ env.PR_URL }})\", \"inline\": true},
                  {\"name\": \"작성자\", \"value\": \"${{ github.actor }}\", \"inline\": true},
                  {\"name\": \"Lint\", \"value\": \"✅ 성공\", \"inline\": true},
                  {\"name\": \"Build\", \"value\": \"✅ 성공\", \"inline\": true}
                ],
                \"url\": \"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"
              }]
            }" \
            "${{ secrets.DISCORD_WEBHOOK }}"

      - name: Fail workflow if checks failed
        if: |
          steps.lint.outcome == 'failure' ||
          steps.build.outcome == 'failure'
        run: exit 1
